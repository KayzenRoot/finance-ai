version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Sao_Paulo
    groups:
      routine-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Sao_Paulo
    groups:
      routine-npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
