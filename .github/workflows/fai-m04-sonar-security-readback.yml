# Temporary read-only audit of Sonar's exact annotations. Remove after collecting logs.
name: FAI M04 Sonar security readback
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/fai-m04-sonar-security-readback.yml
permissions:
  contents: read
  checks: read
jobs:
  inspect:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List pinned 37 Sonar findings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/KayzenRoot/finance-ai/check-runs/120327895980/annotations?per_page=100' |
            jq -c '.[] | {path,start_line,end_line,annotation_level,title,message}'
