# Runs only trusted workflow code from the base branch. NEVER checkout a PR
# or execute user-controlled content in this privileged event.
name: Default PR reviewer

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: default-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Request kayzenweb3 review
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'kayzenweb3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request review from authorized collaborator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # No checkout, third-party action, secrets, or untrusted PR body data.
          permission="$(gh api "repos/$GH_REPO/collaborators/kayzenweb3/permission" --jq '.permission' 2>/dev/null || true)"
          case "$permission" in
            admin|maintain|write)
              gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" \
                -f 'reviewers[]=kayzenweb3'
              echo "Requested a review from kayzenweb3."
              ;;
            *)
              echo "::warning::kayzenweb3 is not a collaborator with write-level review access; invite and grant write access before review can be requested."
              ;;
          esac
